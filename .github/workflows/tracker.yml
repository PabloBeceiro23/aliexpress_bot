name: Monitor de precio AliExpress

on:
  schedule:
    # GitHub Actions ejecuta el cron en UTC. Corre a los minutos 17 de cada hora par.
    - cron: '17 */2 * * *'
  workflow_dispatch:

# Evita ejecuciones simultáneas si una consulta tarda más de lo previsto.
concurrency:
  group: aliexpress-price-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-price:
    name: Consultar precio y avisar por WhatsApp
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Verificar utilidades del rastreador
        run: |
          python tracker.py --self-test
          python scripts/test_notifier.py

      - name: Consultar AliExpress
        env:
          PRODUCT_URL: https://es.aliexpress.com/item/1005007999908066.html
          WA_ACCESS_TOKEN: ${{ secrets.WA_ACCESS_TOKEN }}
          WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
          WA_RECIPIENT: ${{ secrets.WA_RECIPIENT }}
          WA_TEMPLATE_PRICE: ${{ vars.WA_TEMPLATE_PRICE || 'aliexpress_price_alert' }}
          WA_TEMPLATE_FAILURE: ${{ vars.WA_TEMPLATE_FAILURE || 'aliexpress_tracker_error' }}
          WA_TEMPLATE_LANGUAGE: ${{ vars.WA_TEMPLATE_LANGUAGE || 'es' }}
          WA_API_VERSION: v26.0
        run: python tracker.py

      # Se publica siempre: incluye la captura si hubo CAPTCHA, error de red o
      # un cambio inesperado de la estructura de la ficha.
      - name: Subir diagnóstico de fallo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aliexpress-diagnostic-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Guardar el último precio confirmado
        if: success()
        run: |
          if git diff --quiet -- price_state.json; then
            echo "El estado no cambió."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price_state.json
          git commit -m "chore: actualizar precio monitorizado"
          git push
