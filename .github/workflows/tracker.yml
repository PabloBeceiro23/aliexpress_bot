name: Monitor AliExpress

on:
  schedule:
    # Se ejecuta automáticamente cada 2 horas (al minuto 20 de cada hora par)
    - cron: '20 */2 * * *'
  workflow_dispatch: # Habilita el botón manual para probarlo cuando quieras

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías y Chromium
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Ejecutar el script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python tracker.py

      - name: Guardar nuevo precio en GitHub si cambió
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add precio_guardado.txt || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: actualizar precio guardado" && git push)
